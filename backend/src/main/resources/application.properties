spring.application.name=mini-credit

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/microcredit_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

app.credit.penalite-journaliere=2500
app.frontend-public-url=${FRONTEND_PUBLIC_URL:http://localhost:4200}
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.employe-max-size=${EMPLOYE_PHOTO_MAX_SIZE:2097152}
app.backend-public-url=${BACKEND_PUBLIC_URL:http://localhost:8080}

# JWT Configuration
app.security.jwt.secret=${JWT_SECRET:change-me-in-environment}
app.security.jwt.expiration=86400000
app.security.jwt.legacy-responsable-enabled=true
app.security.jwt.legacy-responsable-disable-after=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-16-char-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=your-email@gmail.com
server.address=0.0.0.0
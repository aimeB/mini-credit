<div class="min-h-screen bg-slate-100 flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6">
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Changer mon mot de passe</h1>
    <p class="text-sm text-slate-600 mb-6">Pour continuer, vous devez définir un nouveau mot de passe.</p>

    @if (errorMessage) {
      <div class="mb-4 rounded-md bg-red-50 border border-red-200 text-red-700 text-sm px-3 py-2">
        {{ errorMessage }}
      </div>
    }

    @if (successMessage) {
      <div class="mb-4 rounded-md bg-green-50 border border-green-200 text-green-700 text-sm px-3 py-2">
        {{ successMessage }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Ancien mot de passe</label>
        <input
          type="password"
          formControlName="oldPassword"
          class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nouveau mot de passe</label>
        <input
          type="password"
          formControlName="newPassword"
          class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Confirmer le nouveau mot de passe</label>
        <input
          type="password"
          formControlName="confirmPassword"
          class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full rounded-md bg-blue-600 text-white py-2.5 font-semibold hover:bg-blue-700 disabled:opacity-60"
      >
        {{ loading ? 'Traitement...' : 'Changer le mot de passe' }}
      </button>
    </form>
  </div>
</div>

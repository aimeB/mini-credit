<div class="page">
  <div class="bg-gradient-to-r from-emerald-900 via-teal-800 to-emerald-900 text-white rounded-xl shadow-lg mb-6 p-6">
    <h2 class="text-2xl font-bold">Nouvelle caisse</h2>
    <p class="text-emerald-100 mt-1 text-sm">Créez une caisse principale rattachée à une agence, avec site optionnel.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="bg-white rounded-xl shadow-md p-6 grid grid-cols-1 md:grid-cols-2 gap-5">
    <div class="md:col-span-2">
      <h3 class="text-lg font-semibold text-gray-900 mb-2">1. Informations caisse</h3>
      <div class="h-px bg-gray-200"></div>
    </div>

    <div class="form-group">
      <label class="block text-sm font-semibold text-gray-700 mb-1">Code caisse (auto)</label>
      <input type="text" [value]="generatedCode" readonly class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-gray-100 text-gray-700" />
    </div>

    <div class="form-group">
      <label class="block text-sm font-semibold text-gray-700 mb-1">Libellé *</label>
      <input type="text" formControlName="libelle" class="w-full rounded-lg border border-gray-300 px-3 py-2" />
    </div>

    <div class="form-group">
      <label class="block text-sm font-semibold text-gray-700 mb-1">Agence *</label>
      <select formControlName="agenceId" class="w-full rounded-lg border border-gray-300 px-3 py-2" [disabled]="loadingAgences">
        <option [ngValue]="null">-- Sélectionner une agence --</option>
        <option *ngFor="let agence of agences" [ngValue]="agence.id">{{ agence.nomAgence }} ({{ agence.codeAgence }})</option>
      </select>
    </div>

    <div class="form-group">
      <label class="block text-sm font-semibold text-gray-700 mb-1">Site associé (optionnel)</label>
      <select formControlName="siteId" class="w-full rounded-lg border border-gray-300 px-3 py-2" [disabled]="loadingSites || !form.get('agenceId')?.value">
        <option [ngValue]="null">-- Aucun site associé --</option>
        <option *ngFor="let site of filteredSites" [ngValue]="site.id">{{ site.nomSite }} ({{ site.codeSite }})</option>
      </select>
    </div>

    <div class="form-group">
      <label class="block text-sm font-semibold text-gray-700 mb-1">Devise *</label>
      <select formControlName="devise" class="w-full rounded-lg border border-gray-300 px-3 py-2">
        <option value="CDF">CDF</option>
        <option value="USD">USD</option>
      </select>
    </div>

    <div class="md:col-span-2 mt-2">
      <h3 class="text-lg font-semibold text-gray-900 mb-2">2. Affectation</h3>
      <div class="h-px bg-gray-200"></div>
    </div>

    <div class="form-group md:col-span-2">
      <label class="block text-sm font-semibold text-gray-700 mb-1">Caissier affecté</label>
      <select formControlName="caissierId" class="w-full rounded-lg border border-gray-300 px-3 py-2" [disabled]="loadingCaissiers">
        <option [ngValue]="null">-- Sélectionner un caissier (optionnel) --</option>
        <option *ngFor="let c of caissiers" [ngValue]="c.id">{{ c.nomComplet || c.username }}</option>
      </select>
      <p class="text-xs text-gray-500 mt-1">La création de caisse n'exige pas la saisie manuelle d'un ID utilisateur.</p>
    </div>

    <div class="md:col-span-2" *ngIf="error">
      <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ error }}</div>
    </div>
    <div class="md:col-span-2" *ngIf="success">
      <div class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700">{{ success }}</div>
    </div>

    <div class="md:col-span-2 mt-2 flex items-center gap-3">
      <button type="submit" class="px-5 py-2.5 rounded-lg bg-emerald-600 text-white font-semibold hover:bg-emerald-700 disabled:opacity-60"
        [disabled]="loading || loadingAgences || loadingSites || (isCaissier && !currentUserAgenceId)">
        {{ loading ? 'Enregistrement...' : 'Créer la caisse' }}
      </button>
      <a routerLink="/caisses" class="px-5 py-2.5 rounded-lg bg-gray-200 text-gray-700 font-semibold hover:bg-gray-300">
        Annuler
      </a>
    </div>
  </form>
</div>

<div class="min-h-[60vh] flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-2xl rounded-xl border border-red-200 bg-white shadow-lg p-8">
    <h1 class="text-2xl font-bold text-red-700">403 - Accès refusé</h1>

    <p class="mt-4 text-gray-800 font-medium">{{ title }}</p>

    <p *ngIf="detail" class="mt-3 text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-4 py-3">
      {{ detail }}
    </p>

    <p *ngIf="requestUrl" class="mt-3 text-xs text-slate-700 bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 break-all">
      URL refusée : {{ requestUrl }}
    </p>

    <p class="mt-4 text-sm text-gray-600">
      {{ supportMessage }}
    </p>

    <div class="mt-6 flex flex-wrap gap-3">
      <button
        type="button"
        class="px-4 py-2 rounded-lg bg-slate-700 text-white text-sm font-semibold hover:bg-slate-800"
        (click)="goPrevious()">
        Retour à la page précédente
      </button>

      <button
        type="button"
        class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700"
        (click)="goHome()">
        Retour à l'accueil
      </button>
    </div>
  </div>
</div>
